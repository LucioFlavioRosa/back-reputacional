name: CI

# Em push para `main` e em todo pull request. Não roda em tag nem em push de
# branch de rascunho: o que interessa é o que vai para `main` e o que pede para
# entrar nela.
on:
  push:
    branches: [main]
  pull_request:

# Um push novo cancela a execução anterior do MESMO branch. Sem isto, uma
# sequência de commits enfileira execuções que já nasceram obsoletas.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Só leitura. Nada aqui publica nem comenta — não há motivo para o token poder.
permissions:
  contents: read

# AS VERSOES DAS ACOES: majors, e todas em Node 24.
#
# O runner do GitHub aposentou o Node 20 (setembro de 2025) e passou a executar
# em Node 24 as ações que ainda declaram `node20`, emitindo aviso. Estas quatro
# majors declaram `node24` e exigem runner >= v2.327.1 — o `ubuntu-latest`
# hospedado passou disso.
#
# `setup-python` fica no v6, e não no v7: o v7 migrou para ESM e ainda é
# recente. O v6 já é Node 24, que é o que o aviso pedia. Subir para v7 é
# seguro quando o time quiser — a única remoção do v7 foi a entrada
# `pip-install`, que não usamos.
#
# Ao subir qualquer uma: `cache: pip` (setup-python) e `cache-from/cache-to:
# type=gha` (build-push) são o que este workflow depende. Confira se a major
# nova ainda os aceita antes de trocar.

env:
  # A versão que a imagem de produção usa. Ver o `Dockerfile`.
  PYTHON_PRODUCAO: "3.13"

jobs:
  # ===========================================================================
  qualidade:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_PRODUCAO }}
          cache: pip

      # DO LOCK, como todo o resto: um ruff mais novo traz regra nova, e o
      # lint passaria a falhar num commit que não mexeu em nada.
      - run: pip install --require-hashes -r requirements-dev.txt

      # As regras estão em `pyproject.toml`: E, F, I, UP, B e FAST — a última é
      # o conjunto específico de FastAPI.
      #
      # `ruff format` NÃO entra aqui: o código é formatado à mão, com blocos de
      # comentário que o formatador reorganizaria. E um passo que nunca falha só
      # ensinaria o time a ignorar a saída do CI.
      - name: ruff check
        run: ruff check --no-cache .

  # ===========================================================================
  testes:
    name: Testes · Python ${{ matrix.python }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 3.12 é o piso declarado em `pyproject.toml`; 3.13 é o que a imagem de
        # produção roda. Rodar os dois é o que impede "passa aqui e quebra lá".
        python: ["3.12", "3.13"]

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: painel_reputacional
        ports:
          - 5432:5432
        # Sem o healthcheck, os testes começam antes de o banco aceitar conexão
        # e falham por corrida, não por defeito.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # A suíte cria e migra o próprio banco (`painel_reputacional_teste`) a
      # cada execução, a partir deste servidor. Ver `tests/test_e2e_postgres.py`.
      BANCO_URL_TESTE: postgresql+psycopg2://postgres:postgres@localhost:5432/painel_reputacional

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # DO LOCK. O CI precisa provar a MESMA combinação de versões que a
      # imagem publica; instalar pelas faixas provaria outra.
      - run: pip install --require-hashes -r requirements-dev.txt
      # O projeto em si, sem tocar nas dependências já travadas.
      - run: pip install --no-deps -e .

      # `-p no:randomly` não é usado: a suíte não depende de ordem, e queremos
      # saber se algum dia passar a depender.
      - name: pytest
        run: python -m pytest -q

  # ===========================================================================
  migrations:
    name: Migrations · pg${{ matrix.postgres }} · ${{ matrix.modo }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # O piso é o 15, e não é escolha de conveniência: até o 14 o schema
        # `public` pertence a `postgres` e concede CREATE a PUBLIC por padrão.
        # Uma conta comum não consegue revogar isso — o Postgres emite WARNING,
        # não erro —, e o banco ficaria sem a garantia de que as funções
        # `security definer` dependem. A migration 0005 agora RECUSA aplicar
        # nesse estado; ver o `raise` lá.
        #
        # O 13 está fora de suporte desde novembro de 2025. O Azure Flexible
        # Server oferece 15, 16 e 17.
        postgres: ["15", "16", "17", "18"]
        modo: [superusuario, conta-comum]

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      # O modo `conta-comum` é o que importa para o deploy: no Postgres
      # gerenciado do Azure a conta administrativa NÃO é superusuário, e as
      # migrations criam roles e transferem posse de funções `security definer`
      # para elas. Isso já quebrou de verdade — com mensagens diferentes até o
      # 15 ("must be member of role") e do 16 em diante ("must be able to SET
      # ROLE"). As migrations 0005 e 0006 tratam os dois casos.
      #
      # Cada combinação da matriz roda num contêiner PRÓPRIO. É requisito, e não
      # zelo: roles no Postgres são de CLUSTER, então reaproveitar o servidor
      # entre os dois modos faria o segundo encontrar as roles já criadas pelo
      # primeiro e falhar por um motivo que não é o testado.
      - name: Prepara o banco e a conta
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          if [ "${{ matrix.modo }}" = "superusuario" ]; then
            psql -h localhost -U postgres -c "create database alvo"
            echo "USUARIO=postgres" >> "$GITHUB_ENV"
            echo "PGPASSWORD=postgres" >> "$GITHUB_ENV"
          else
            psql -h localhost -U postgres \
              -c "create role aplicador login createrole createdb password 'aplicador'"
            psql -h localhost -U postgres -c "create database alvo owner aplicador"
            echo "USUARIO=aplicador" >> "$GITHUB_ENV"
            echo "PGPASSWORD=aplicador" >> "$GITHUB_ENV"
          fi

      # `USUARIO` e `PGPASSWORD` vêm do passo anterior, por `$GITHUB_ENV`.
      - name: Aplica as migrations em ordem
        run: |
          set -euo pipefail
          for arquivo in app/banco/migrations/*.sql; do
            echo "→ $(basename "$arquivo")"
            psql -h localhost -U "$USUARIO" -d alvo -q -v ON_ERROR_STOP=1 -f "$arquivo"
          done

      # Contar tabelas prova que rodou; conferir a posse das funções prova que a
      # parte que quebra sem superusuário de fato aconteceu.
      - name: Confere o resultado
        run: |
          set -euo pipefail
          consulta() { psql -h localhost -U "$USUARIO" -d alvo -tAc "$1"; }

          # AS TABELAS-ÂNCORA, e não uma contagem exata.
          #
          # Um número fixo aqui envelhece na migration seguinte, e o CI passa a
          # falhar por estar desatualizado — que é ruído, não defeito. Estas
          # cinco vêm de migrations diferentes: se todas existem, a sequência
          # inteira rodou. O piso pega o caso de uma migration parar no meio
          # sem erro visível.
          for tabela in frente instituicao papel interacao referencia_versao; do
            existe=$(consulta "select to_regclass('public.$tabela') is not null")
            echo "$tabela: $existe"
            test "$existe" = "t"
          done

          tabelas=$(consulta "select count(*) from information_schema.tables where table_schema='public'")
          echo "tabelas: $tabelas"
          test "$tabelas" -ge 46

          donos=$(consulta "select string_agg(distinct proowner::regrole::text, ',' order by proowner::regrole::text)
                              from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                             where n.nspname = 'public' and p.prosecdef")
          echo "donos das funcoes security definer: $donos"
          test "$donos" = "painel_auditoria,painel_concessao"

          # O `grant create` da transferência de posse é temporário. Se sobrar,
          # uma role de sistema fica podendo criar objeto em `public` — e é
          # justamente disso que o `search_path` das funções depende.
          sobrou=$(consulta "select count(*) from pg_roles r
                              where r.rolname like 'painel%'
                                and has_schema_privilege(r.rolname, 'public', 'CREATE')")
          echo "roles painel* com CREATE em public: $sobrou"
          test "$sobrou" -eq 0

  # ===========================================================================
  imagem:
    name: Imagem Docker
    runs-on: ubuntu-latest
    # Não faz sentido construir a imagem se o código nem passa no linter.
    needs: [qualidade]

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Não publica: só prova que constrói. A publicação é decisão de quem
      # implanta, e vai exigir credencial de registro.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: back-reputacional:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # O build sozinho não prova nada sobre caminho de import: um `COPY`
      # errado só aparece quando o processo sobe. Aqui a imagem roda contra um
      # Postgres de verdade, com as migrations aplicadas.
      - name: A imagem sobe e responde
        run: |
          set -euo pipefail
          docker network create ci >/dev/null

          docker run -d --name banco --network ci \
            -e POSTGRES_PASSWORD=x -e POSTGRES_DB=painel \
            -v "$PWD/app/banco/migrations:/docker-entrypoint-initdb.d:ro" \
            postgres:18-alpine >/dev/null

          # ESPERAR POR TCP DE FORA, e não pelo socket de dentro.
          #
          # O entrypoint do Postgres sobe o servidor escutando SÓ o socket unix,
          # roda os scripts de `/docker-entrypoint-initdb.d`, e só então reinicia
          # aceitando TCP. Os três sinais possíveis não valem o mesmo:
          #
          #   `pg_isready` por `docker exec`    responde no socket, antes da carga
          #   `select 1 from papel`             `papel` nasce na 0003, de 63 —
          #                                     passa com 5% das migrations
          #   `pg_isready -h banco` de outro    só responde depois de TODAS
          #   container
          #
          # ERA ISSO QUE QUEBRAVA: medido nesta máquina, com as 63 migrations, o
          # `select 1 from papel` passa em 6s e o TCP abre em 12s. A largada era
          # dada aos 6s, a API subia, conectava por TCP e tomava
          # "Connection refused" — e as sete rotas vinham 500 enquanto
          # `/api/saude`, que não toca o banco, vinha 200. Quanto mais migration
          # o projeto ganha, maior a janela; o sinal estava errado desde sempre e
          # só passou a doer com o volume.
          pronto=0
          for _ in $(seq 1 60); do
            if docker run --rm --network ci postgres:18-alpine \
                 pg_isready -h banco -U postgres -d painel >/dev/null 2>&1; then
              pronto=1
              break
            fi
            sleep 2
          done
          if [ "$pronto" -ne 1 ]; then
            echo "O Postgres nao aceitou conexao TCP em 120s." >&2
            echo "--- log do banco ---" >&2
            docker logs banco >&2
            exit 1
          fi

          # E AS MIGRATIONS RODARAM MESMO?
          #
          # O entrypoint IGNORA EM SILÊNCIO um `/docker-entrypoint-initdb.d`
          # vazio — ele escreve "ignoring /docker-entrypoint-initdb.d/*" no log e
          # segue, com o banco pronto e sem uma única tabela. Um `COPY` ou um
          # mount errado passaria por todas as esperas acima e só apareceria como
          # 500 nas rotas, bem longe da causa. Encontrei esse modo de falha ao
          # medir a corrida, e ele custou meia hora.
          tabelas=$(docker exec banco psql -U postgres -d painel -tAc \
            "select count(*) from information_schema.tables where table_schema='public'")
          if [ "${tabelas:-0}" -lt 60 ]; then
            echo "O banco subiu com $tabelas tabelas; as migrations nao rodaram." >&2
            echo "--- log do banco ---" >&2
            docker logs banco >&2
            exit 1
          fi
          echo "  banco pronto, $tabelas tabelas"

          docker run -d --name api --network ci -p 8000:8000 \
            -e BANCO_URL="postgresql+psycopg2://postgres:x@banco:5432/painel" \
            -e AUTH_MOCK=true \
            -e SESSAO_SECRETA=ci-somente-para-teste-com-mais-de-32-caracteres \
            -e ORIGENS_PERMITIDAS='["http://localhost:5173"]' \
            back-reputacional:ci >/dev/null

          # `/api/saude` NÃO TOCA O BANCO, de propósito: ele responde se o
          # processo subiu. Serve para esperar o uvicorn, e não para dizer que a
          # aplicação funciona — quem diz isso são as sete rotas abaixo.
          subiu=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/saude >/dev/null 2>&1; then
              subiu=1
              break
            fi
            sleep 2
          done
          if [ "$subiu" -ne 1 ]; then
            echo "A API nao respondeu /api/saude em 60s." >&2
            echo "--- log da API ---" >&2
            docker logs api >&2
            exit 1
          fi

          falhou=0
          for rota in /api/saude /api/eu /api/interacoes /api/metricas/kpis \
                      /api/metricas/mapa /api/dicionarios /api/instituicoes; do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8000$rota")
            printf '  %-24s %s\n' "$rota" "$codigo"
            [ "$codigo" = "200" ] || falhou=1
          done

          if [ "$falhou" -ne 0 ]; then
            echo "--- log da API ---"
            docker logs api
            exit 1
          fi

      - name: Log da API em caso de falha
        if: failure()
        run: docker logs api || true

  # ===========================================================================
  # Um alvo só para a regra de proteção do branch apontar.
  #
  # Sem isto, proteger `main` exigiria listar cada combinação da matriz pelo
  # nome — e acrescentar uma versão de Postgres passaria a exigir mexer na
  # configuração do repositório, coisa que ninguém lembra de fazer. O resultado
  # seria uma proteção que silenciosamente deixa de cobrir o caso novo.
  #
  # `if: always()` para este job rodar mesmo com etapa anterior falhando: é
  # justamente aí que ele precisa reprovar.
  resumo:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs: [qualidade, testes, migrations, imagem]
    steps:
      - name: Alguma etapa falhou?
        run: |
          echo "qualidade:  ${{ needs.qualidade.result }}"
          echo "testes:     ${{ needs.testes.result }}"
          echo "migrations: ${{ needs.migrations.result }}"
          echo "imagem:     ${{ needs.imagem.result }}"
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "::error::alguma etapa do CI não passou"
            exit 1
          fi
