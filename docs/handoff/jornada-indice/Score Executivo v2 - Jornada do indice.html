document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

voTemLente }}\" hint-placeholder-val=\"{{ false }}\">\n              <path d=\"{{ evoCurvaLente }}\" fill=\"none\" stroke=\"#9DA6C9\" stroke-width=\"2.5\" stroke-dasharray=\"6 6\" stroke-linecap=\"round\"><\u002Fpath>\n              <sc-for list=\"{{ evoPontosLente }}\" as=\"p\" hint-placeholder-count=\"6\">\n                <circle cx=\"{{ p.cx }}\" cy=\"{{ p.cy }}\" r=\"4\" fill=\"#fff\" stroke=\"#9DA6C9\" stroke-width=\"2\"><\u002Fcircle>\n              <\u002Fsc-for>\n            <\u002Fsc-if>\n            <path d=\"{{ evoCurva }}\" fill=\"none\" stroke=\"#0027BD\" stroke-opacity=\"0.22\" stroke-width=\"14\" stroke-linecap=\"round\"><\u002Fpath>\n            <path d=\"{{ evoCurva }}\" fill=\"none\" stroke=\"#0027BD\" stroke-width=\"3.5\" stroke-linecap=\"round\"><\u002Fpath>\n            <sc-for list=\"{{ evoPontos }}\" as=\"p\" hint-placeholder-count=\"6\">\n              <circle cx=\"{{ p.cx }}\" cy=\"{{ p.cy }}\" r=\"{{ p.r }}\" fill=\"{{ p.cor }}\" stroke=\"{{ p.stroke }}\" stroke-width=\"3\" style=\"cursor:pointer\" sc-camel-on-click=\"{{ p.go }}\"><\u002Fcircle>\n            <\u002Fsc-for>\n          <\u002Fsvg>\n          <sc-for list=\"{{ evoBandas }}\" as=\"b\" hint-placeholder-count=\"3\">\n            <span style=\"{{ b.labelStyle }}\">{{ b.label }}<\u002Fspan>\n          <\u002Fsc-for>\n          <sc-for list=\"{{ evoTicks }}\" as=\"t\" hint-placeholder-count=\"4\">\n            <span style=\"{{ t.style }}\">{{ t.label }}<\u002Fspan>\n          <\u002Fsc-for>\n          <sc-for list=\"{{ evoPontos }}\" as=\"p\" hint-placeholder-count=\"6\">\n            <span style=\"{{ p.labStyle }}\">\n              <span style=\"font-size:16px;font-weight:700;letter-spacing:-0.02em;color:{{ p.valorCor }}\">{{ p.valor }}<\u002Fspan>\n              <span style=\"{{ p.tagStyle }}\">{{ p.tag }}<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fsc-for>\n          <span style=\"{{ evoUltimaLente.style }}\">{{ evoUltimaLente.txt }}<\u002Fspan>\n          <sc-for list=\"{{ evoMeses }}\" as=\"m\" hint-placeholder-count=\"6\">\n            <span style=\"{{ m.style }}\">{{ m.label }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:16px;flex-wrap:wrap;margin:12px 92px 0 34px;font-size:11px;color:#8C91A4\">\n          <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:14px;height:3px;border-top:3px solid #FF5C60\"><\u002Fspan>fato que pressiona<\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:14px;height:3px;border-top:3px solid #17E3CB\"><\u002Fspan>fato que sustenta<\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:14px;height:3px;border-top:3px solid #9DA6C9\"><\u002Fspan>misto<\u002Fspan>\n          <span>Faixas ao fundo · clique num mês para ver o índice daquele período<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isLentes }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"margin-bottom:18px\">\n      <h1 style=\"margin:0;font-size:24px;font-weight:700;letter-spacing:-0.02em\">Lentes<\u002Fh1>\n      <p style=\"margin:5px 0 0;font-size:14px;color:#44495C;max-width:78ch;text-wrap:pretty\">Como cada stakeholder enxerga a companhia no período: composição do sentimento, fórmula aplicada e os temas que movem o número.<\u002Fp>\n    <\u002Fdiv>\n\n    <section style=\"background:#fff;border:1px solid #E2E5F0;border-radius:14px;padding:22px;margin-bottom:16px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid #EEF1F8\">\n        <div>\n          <div style=\"font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#8C91A4;margin-bottom:9px\">Lente<\u002Fdiv>\n          <div style=\"display:flex;gap:7px;flex-wrap:wrap\">\n            <sc-for list=\"{{ lenteTabs }}\" as=\"t\" hint-placeholder-count=\"5\">\n              <button sc-camel-on-click=\"{{ t.go }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:minmax(280px,1fr) minmax(300px,1.4fr);gap:24px;align-items:start\">\n        <div>\n          <div style=\"font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#8C91A4\">Lente selecionada<\u002Fdiv>\n          <h3 style=\"margin:6px 0 4px;font-size:20px;font-weight:700;letter-spacing:-0.01em\">{{ selNome }}<\u002Fh3>\n          <p style=\"margin:0 0 16px;font-size:13px;color:#44495C;line-height:1.6;text-wrap:pretty\">{{ selDesc }}<\u002Fp>\n          <div style=\"display:flex;height:14px;border-radius:7px;overflow:hidden;background:#EEF1F8\">\n            <div title=\"Positivo\" style=\"width:{{ selPosW }};background:#17E3CB\"><\u002Fdiv>\n            <div title=\"Neutro\" style=\"width:{{ selNeuW }};background:#D5DAEA\"><\u002Fdiv>\n            <div title=\"Negativo\" style=\"width:{{ selNegW }};background:#FF5C60\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:10px;font-size:12px;color:#44495C;margin-top:8px\">\n            <span><strong style=\"color:#0A6B60\">{{ selPos }}<\u002Fstrong> positivo<\u002Fspan>\n            <span><strong>{{ selNeu }}<\u002Fstrong> neutro<\u002Fspan>\n            <span><strong style=\"color:#B32328\">{{ selNeg }}<\u002Fstrong> negativo<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"margin-top:14px;padding:12px 14px;background:#F4F6FC;border-radius:10px;font-size:12px;color:#44495C;line-height:1.6\">\n            <strong>Cálculo:<\u002Fstrong> {{ selFormula }}\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#8C91A4;margin-bottom:10px\">O que movimenta esta lente<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <sc-for list=\"{{ selTemas }}\" as=\"t\" hint-placeholder-count=\"5\">\n              <div style=\"display:grid;grid-template-columns:1fr 90px;gap:12px;align-items:center\">\n                <div style=\"display:flex;flex-direction:column;gap:5px\">\n                  <div style=\"display:flex;justify-content:space-between;gap:10px;font-size:13px\">\n                    <span>{{ t.label }}<\u002Fspan>\n                    <span style=\"color:#44495C\">{{ t.valor }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;height:7px;border-radius:4px;overflow:hidden;background:#EEF1F8\">\n                    <div style=\"width:{{ t.posW }};background:#17E3CB\"><\u002Fdiv>\n                    <div style=\"width:{{ t.negW }};background:#FF5C60\"><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"{{ t.tipoStyle }}\">{{ t.tipo }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isRiscos }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"margin-bottom:18px\">\n      <h1 style=\"margin:0;font-size:24px;font-weight:700;letter-spacing:-0.02em\">Drivers e riscos<\u002Fh1>\n      <p style=\"margin:5px 0 0;font-size:14px;color:#44495C;max-width:78ch;text-wrap:pretty\">O porquê do número: quais atributos sustentam ou corroem, quais temas se perpetuam e onde a exposição nasce.<\u002Fp>\n    <\u002Fdiv>\n\n    <section style=\"margin-bottom:16px\">\n      <div style=\"background:#191B23;color:#fff;border-radius:14px;padding:22px\">\n        <h2 style=\"margin:0 0 4px;font-size:16px;font-weight:700\">Temas em perpetuação<\u002Fh2>\n        <p style=\"margin:0 0 16px;font-size:12px;color:#8C91A4;line-height:1.55\">Quanto tempo um tema negativo fica vivo e se ele é operacional ou estruturante. É o alerta que a Gartner chama de \"caça de ameaça narrativa\".<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <sc-for list=\"{{ perpetuacao }}\" as=\"t\" hint-placeholder-count=\"6\">\n            <div style=\"border-left:2px solid {{ t.cor }};padding-left:12px\">\n              <div style=\"display:flex;justify-content:space-between;gap:10px;align-items:baseline\">\n                <span style=\"font-size:13px;font-weight:700\">{{ t.tema }}<\u002Fspan>\n                <span style=\"font-size:11px;color:#8C91A4;white-space:nowrap\">{{ t.meses }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:6px;margin-top:5px;flex-wrap:wrap\">\n                <span style=\"{{ t.tipoStyle }}\">{{ t.tipo }}<\u002Fspan>\n                <span style=\"font-size:11px;color:#D5DAEA\">{{ t.onde }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <section style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;margin-bottom:16px;align-items:start\">\n      <div style=\"background:#fff;border:1px solid #E2E5F0;border-radius:14px;padding:22px\">\n        <h2 style=\"margin:0 0 4px;font-size:16px;font-weight:700\">Atributos reputacionais<\u002Fh2>\n        <p style=\"margin:0 0 18px;font-size:12px;color:#8C91A4\">Os drivers da Aegea, na taxonomia da própria clipagem. Barra à direita sustenta; à esquerda corrói.<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:13px\">\n          <sc-for list=\"{{ atributos }}\" as=\"a\" hint-placeholder-count=\"5\">\n            <div>\n              <div style=\"display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:6px\">\n                <span style=\"font-weight:500\">{{ a.nome }}<\u002Fspan>\n                <span style=\"color:#44495C\"><strong style=\"color:{{ a.cor }}\">{{ a.score }}<\u002Fstrong> · {{ a.volume }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"position:relative;height:10px;background:#EEF1F8;border-radius:5px;overflow:hidden\">\n                <div style=\"position:absolute;left:50%;top:0;bottom:0;width:1px;background:#C3CDF7\"><\u002Fdiv>\n                <div style=\"position:absolute;top:0;bottom:0;left:{{ a.left }};width:{{ a.width }};background:{{ a.cor }};border-radius:5px\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font-size:11px;color:#A6ABBD;margin-top:14px;line-height:1.5\">Fonte: Clipei junho/2026 (atributo × classificação), complementado por temas do social listening para Responsabilidade Socioambiental.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #E2E5F0;border-radius:14px;padding:22px\">\n        <h2 style=\"margin:0 0 4px;font-size:16px;font-weight:700\">Exposição por unidade<\u002Fh2>\n        <p style=\"margin:0 0 18px;font-size:12px;color:#8C91A4\">Onde a negatividade das redes nasce. Aplica o racional do Score2 da Aegea assim que a base de economias for integrada.<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:11px\">\n          <sc-for list=\"{{ unidades }}\" as=\"u\" hint-placeholder-count=\"6\">\n            <div style=\"display:grid;grid-template-columns:1fr 72px;gap:12px;align-items:center\">\n              <div style=\"display:flex;flex-direction:column;gap:5px\">\n                <div style=\"display:flex;justify-content:space-between;gap:10px;font-size:13px\">\n                  <span>{{ u.nome }}<\u002Fspan>\n                  <span style=\"color:#44495C\">{{ u.neg }} neg. · {{ u.share }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"height:7px;background:#EEF1F8;border-radius:4px;overflow:hidden\">\n                  <div style=\"height:100%;width:{{ u.w }};background:#FF5C60;border-radius:4px\"><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"{{ u.cmStyle }}\">{{ u.cm }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:14px;font-size:11px;color:#A6ABBD;margin-top:14px;flex-wrap:wrap\">\n          <span>Barras: menções negativas em mar aberto (Bites, junho)<\u002Fspan>\n          <span>Chip: % negativo nos canais próprios (Approach CM)<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isCalibracao }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"margin-bottom:18px\">\n      <h1 style=\"margin:0;font-size:24px;font-weight:700;letter-spacing:-0.02em\">Calibração<\u002Fh1>\n      <p style=\"margin:5px 0 0;font-size:14px;color:#44495C;max-width:78ch;text-wrap:pretty\">Para o time de comunicação, não para a diretoria: pesos, ponderações e fontes. Tudo recalcula o índice na hora, e a visão geral indica quando a calibração não é a padrão.<\u002Fp>\n    <\u002Fdiv>\n\n    <section style=\"background:#fff;border:1px solid #E2E5F0;border-radius:14px;padding:22px;margin-bottom:16px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:14px\">\n        <div>\n          <h2 style=\"margin:0;font-size:16px;font-weight:700\">Pesos das lentes<\u002Fh2>\n          <p style=\"margin:4px 0 0;font-size:12px;color:#8C91A4\">Somam {{ somaPesos }}%. Se a soma não for 100, o índice normaliza pela soma.<\u002Fp>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ resetCalib }}\" style=\"height:34px;padding:0 14px;border:1px solid #D5DAEA;background:#fff;border-radius:8px;font-size:13px;color:#44495C;cursor:pointer\" style-hover=\"border-color:#0027BD;color:#0027BD\">Restaurar padrão<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px\">\n        <sc-for list=\"{{ pesosCtl }}\" as=\"p\" hint-placeholder-count=\"5\">\n          <div style=\"border:1px solid #E2E5F0;border-radius:12px;padding:14px\">\n            <div style=\"font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#8C91A4\">{{ p.nome }}<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px\">\n              <button sc-camel-on-click=\"{{ p.menos }}\" style=\"width:32px;height:32px;border-radius:8px;border:1px solid #D5DAEA;background:#fff;font-size:16px;cursor:pointer;color:#44495C\">−<\u002Fbutton>\n              <span style=\"font-size:26px;font-weight:700;letter-spacing:-0.02em\">{{ p.valor }}%<\u002Fspan>\n              <button sc-camel-on-click=\"{{ p.mais }}\" style=\"width:32px;height:32px;border-radius:8px;border:1px solid #D5DAEA;background:#fff;font-size:16px;cursor:pointer;color:#44495C\">+<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"height:6px;background:#EEF1F8;border-radius:3px;overflow:hidden;margin-top:10px\">\n              <div style=\"height:100%;width:{{ p.w }};background:#0027BD;border-radius:3px\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:11px;color:#8C91A4;margin-top:8px\">padrão {{ p.padrao }}%<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"background:#fff;border:1px solid #E2E5F0;border-radius:14px;padding:22px;margin-bottom:16px\">\n      <h2 style=\"margin:0 0 16px;font-size:16px;font-weight:700\">Ponderações<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:24px\">\n        <div>\n          <div style=\"font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#8C91A4;margin-bottom:9px\">Peso por relevância do veículo · Tier 1 · 2 · 3<\u002Fdiv>\n          <div style=\"display:flex;gap:7px;flex-wrap:wrap\">\n            <sc-for list=\"{{ tierPresets }}\" as=\"t\" hint-placeholder-count=\"5\">\n              <button sc-camel-on-click=\"{{ t.go }}\" style=\"{{ t.style }}\">\n                <span style=\"{{ t.labelStyle }}\">{{ t.label }}<\u002Fspan>\n                <span style=\"font-size:11px;color:#8C91A4\">{{ t.desc }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size:11px;color:#A6ABBD;margin-top:8px;max-width:60ch;line-height:1.5\">{{ tierNota }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#8C91A4;margin-bottom:9px\">Peso por engajamento · redes<\u002Fdiv>\n          <div style=\"display:flex;gap:7px;flex-wrap:wrap\">\n            <sc-for list=\"{{ socialPresets }}\" as=\"t\" hint-placeholder-count=\"4\">\n              <button sc-camel-on-click=\"{{ t.go }}\" style=\"{{ t.style }}\">\n                <span style=\"{{ t.labelStyle }}\">{{ t.label }}<\u002Fspan>\n                <span style=\"font-size:11px;color:#8C91A4\">{{ t.desc }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size:11px;color:#A6ABBD;margin-top:8px;max-width:60ch;line-height:1.5\">{{ socialNota }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <section style=\"background:#fff;border:1px solid #E2E5F0;border-radius:14px;padding:22px;margin-bottom:16px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:14px\">\n        <div>\n          <h2 style=\"margin:0;font-size:16px;font-weight:700\">Fontes<\u002Fh2>\n          <p style=\"margin:4px 0 0;font-size:12px;color:#8C91A4\">Cada fornecedor alimenta uma lente. Desligue para simular o índice sem ele.<\u002Fp>\n        <\u002Fdiv>\n        <span style=\"font-size:12px;color:#8C91A4\">{{ fontesAtivas }} de {{ fontesTotal }} ativas<\u002Fspan>\n      <\u002Fdiv>\n      <sc-if value=\"{{ temAviso }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;align-items:flex-start;gap:10px;background:#FFF1DC;border:1px solid #FFE0B3;border-radius:10px;padding:11px 14px;margin-bottom:12px\">\n          <span style=\"width:9px;height:9px;background:#FE952B;transform:rotate(45deg);margin-top:5px;flex-shrink:0\"><\u002Fspan>\n          <span style=\"font-size:13px;color:#5C3A00;line-height:1.55\">{{ avisoFontes }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"display:flex;flex-direction:column;gap:1px;background:#EEF1F8;border-radius:10px;overflow:hidden\">\n        <div style=\"display:grid;grid-template-columns:52px 1.3fr 1fr 0.8fr 1fr 0.9fr 1fr;gap:14px;align-items:center;background:#F4F6FC;padding:9px 14px\">\n          <span><\u002Fspan>\n          <span style=\"font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#44495C\">Fornecedor<\u002Fspan>\n          <span style=\"font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#44495C\">Tipo<\u002Fspan>\n          <span style=\"font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#44495C\">Lente<\u002Fspan>\n          <span style=\"font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#44495C\">Cobertura<\u002Fspan>\n          <span style=\"font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#44495C\">Volume<\u002Fspan>\n          <span style=\"font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#44495C\">Observação<\u002Fspan>\n        <\u002Fdiv>\n        <sc-for list=\"{{ fontes }}\" as=\"f\" hint-placeholder-count=\"6\">\n          <div style=\"{{ f.rowStyle }}\">\n            <button sc-camel-on-click=\"{{ f.toggle }}\" style=\"{{ f.toggleStyle }}\" title=\"Ligar / desligar fonte\"><span style=\"{{ f.knobStyle }}\"><\u002Fspan><\u002Fbutton>\n            <span style=\"font-size:13px;font-weight:700\">{{ f.nome }}<\u002Fspan>\n            <span style=\"font-size:12px;color:#44495C\">{{ f.tipo }}<\u002Fspan>\n            <span style=\"font-size:12px;font-weight:500;color:#0027BD\">{{ f.lente }}<\u002Fspan>\n            <span style=\"font-size:12px;color:#44495C\">{{ f.cobertura }}<\u002Fspan>\n            <span style=\"font-size:12px;color:#44495C\">{{ f.volume }}<\u002Fspan>\n            <span style=\"{{ f.notaStyle }}\">{{ f.nota }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isMetodologia }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"margin-bottom:18px\">\n      <h1 style=\"margin:0;font-size:24px;font-weight:700;letter-spacing:-0.02em\">Metodologia<\u002Fh1>\n      <p style=\"margin:5px 0 0;font-size:14px;color:#44495C;max-width:78ch;text-wrap:pretty\">Como o índice é construído, o que ele reaproveita da parametrização da Aegea e onde ainda falta dado.<\u002Fp>\n    <\u002Fdiv>\n\n    <section style=\"display:grid;grid-template-columns:minmax(360px,1.3fr) minmax(300px,1fr);gap:16px;align-items:start\">\n      <div style=\"background:#fff;border:1px solid #E2E5F0;border-radius:14px;padding:22px\">\n        <h2 style=\"margin:0 0 4px;font-size:16px;font-weight:700\">Metodologia em uma página<\u002Fh2>\n        <p style=\"margin:0 0 16px;font-size:13px;color:#44495C;line-height:1.6;text-wrap:pretty\">O índice reaproveita o que a Aegea já parametrizou — tiers, sentimentação e atributos da clipagem, pesos 10/5/1 do rascunho de score — e amplia para os stakeholders que a Gartner considera obrigatórios numa leitura de saúde reputacional.<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:1px;background:#EEF1F8;border-radius:10px;overflow:hidden\">\n          <sc-for list=\"{{ metodologia }}\" as=\"m\" hint-placeholder-count=\"6\">\n            <div style=\"display:grid;grid-template-columns:150px 1fr;gap:14px;background:#fff;padding:12px 14px\">\n              <span style=\"font-size:12px;font-weight:700;color:#0027BD\">{{ m.passo }}<\u002Fspan>\n              <span style=\"font-size:12px;color:#44495C;line-height:1.6\">{{ m.texto }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:16px\">\n        <div style=\"background:#fff;border:1px solid #E2E5F0;border-radius:14px;padding:22px\">\n          <h2 style=\"margin:0 0 4px;font-size:16px;font-weight:700\">Aderência ao Market Guide Gartner 2026<\u002Fh2>\n          <p style=\"margin:0 0 14px;font-size:12px;color:#8C91A4\">Critérios obrigatórios e opcionais de um rastreador de saúde reputacional.<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <sc-for list=\"{{ gartner }}\" as=\"g\" hint-placeholder-count=\"7\">\n              <div style=\"display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:13px\">\n                <span style=\"color:#44495C\">{{ g.criterio }}<\u002Fspan>\n                <span style=\"{{ g.chip }}\">{{ g.status }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#FFF1DC;border:1px solid #FFE0B3;border-radius:14px;padding:18px 20px\">\n          <div style=\"font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#8A4E00;margin-bottom:8px\">Dados a integrar para fechar o índice<\u002Fdiv>\n          <ul style=\"margin:0;padding-left:18px;font-size:12px;color:#5C3A00;line-height:1.7\">\n            <li>Clipping mensal jan–mai (hoje só junho em base; os demais meses vêm do resumo semestral Edelman)<\u002Fli>\n            <li>Economias por concessionária, para a intensidade por porte (Score2)<\u002Fli>\n            <li>Share of voice dos players Tier 1 (Sabesp, Iguá, BRK, Copasa)<\u002Fli>\n            <li>Reclame Aqui, Consumidor.gov e notas Google por unidade<\u002Fli>\n            <li>Spread de bonds e debêntures, para cruzar reputação com valor<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n\n\n\n\n\n\n  <\u002Fmain>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;pesoImprensa&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:30,&quot;min&quot;:0,&quot;max&quot;:50,&quot;step&quot;:5,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Pesos das lentes&quot;},&quot;pesoMercado&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:20,&quot;min&quot;:0,&quot;max&quot;:50,&quot;step&quot;:5,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Pesos das lentes&quot;},&quot;pesoSociedade&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:20,&quot;min&quot;:0,&quot;max&quot;:50,&quot;step&quot;:5,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Pesos das lentes&quot;},&quot;pesoClientes&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:15,&quot;min&quot;:0,&quot;max&quot;:50,&quot;step&quot;:5,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Pesos das lentes&quot;},&quot;pesoInstitucional&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:15,&quot;min&quot;:0,&quot;max&quot;:50,&quot;step&quot;:5,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Pesos das lentes&quot;},&quot;radialPorPeso&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Visão geral&quot;}}\">\n// Séries mensais 1S/2026. \"real\" = extraído das planilhas entregues; \"est\" = estimado a partir dos resumos semestrais.\nconst MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun'];\n\n// Approach — social listening, real, em três leituras: contagem (n), 1+log10(engajamento+1) (log) e engajamento bruto (eng)\nconst SL_W = [\n  { n: { pos: 1843, neu: 39, neg: 470 }, log: { pos: 2622, neu: 74, neg: 548 }, eng: { pos: 70783, neu: 1490, neg: 9894 } },\n  { n: { pos: 495, neu: 136, neg: 716 }, log: { pos: 863, neu: 212, neg: 808 }, eng: { pos: 18267, neu: 3566, neg: 3759 } },\n  { n: { pos: 518, neu: 152, neg: 1296 }, log: { pos: 959, neu: 255, neg: 1364 }, eng: { pos: 12557, neu: 3571, neg: 4256 } },\n  { n: { pos: 494, neu: 129, neg: 518 }, log: { pos: 727, neu: 217, neg: 826 }, eng: { pos: 5133, neu: 3573, neg: 8790 } },\n  { n: { pos: 513, neu: 98, neg: 506 }, log: { pos: 985, neu: 159, neg: 655 }, eng: { pos: 13039, neu: 1581, neg: 4785 } },\n  { n: { pos: 707, neu: 142, neg: 1110 }, log: { pos: 1238, neu: 288, neg: 1274 }, eng: { pos: 20544, neu: 25994, neg: 12716 } }\n];\nconst SL = SL_W.map(m => m.n);\n// Bites junho: contagem, log, engajamento bruto e ponderação por cargo do autor (ministro/governador 5 · senador/dep. federal 4 · dep. estadual 3 · prefeito/vereador 2 · demais 1)\nconst BITES_W = {\n  n: { pos: 888, neu: 1501, neg: 2584 }, log: { pos: 1417, neu: 2245, neg: 3714 },\n  eng: { pos: 25237, neu: 43689, neg: 107886 }, cargo: { pos: 888, neu: 1501, neg: 2591 }\n};\nconst SOCIAL_PRESETS = [\n  { id: 'n', label: 'contagem', desc: 'cada menção vale 1' },\n  { id: 'log', label: 'log do engajamento', desc: '1 + log₁₀(interações + 1)' },\n  { id: 'eng', label: 'engajamento bruto', desc: 'viral domina' },\n  { id: 'cargo', label: 'cargo do autor', desc: 'influência institucional · só Bites' }\n];\nconst CM = [ // Approach — community management canais próprios, real\n  { pos: 125, neu: 119, neg: 253 }, { pos: 126, neu: 81, neg: 306 }, { pos: 175, neu: 212, neg: 408 },\n  { pos: 131, neu: 293, neg: 378 }, { pos: 149, neu: 340, neg: 527 }, { pos: 146, neu: 452, neg: 288 }\n];\n// Clipei junho (real) por tier: Muito Relevante 65/64/16 · Relevante 85/43/55 · Menos Relevante 946/80/149\nconst CLIPEI_TIER = {\n  mr: { pos: 65, neu: 64, neg: 16 },\n  r: { pos: 85, neu: 43, neg: 55 },\n  menos: { pos: 946, neu: 80, neg: 149 }\n};\nconst TIER_PRESETS = [\n  { id: 'aegea', label: '10 · 5 · 1', desc: 'rascunho de score da Aegea', w: { mr: 10, r: 5, menos: 1 } },\n  { id: 'suave', label: '5 · 3 · 1', desc: 'relevância atenuada', w: { mr: 5, r: 3, menos: 1 } },\n  { id: 'forte', label: '20 · 5 · 1', desc: 'Tier 1 domina', w: { mr: 20, r: 5, menos: 1 } },\n  { id: 'igual', label: '1 · 1 · 1', desc: 'sem ponderação', w: { mr: 1, r: 1, menos: 1 } },\n  { id: 'so-tier1', label: 'só Tier 1', desc: 'ignora regionais e locais', w: { mr: 1, r: 0, menos: 0 } }\n];\nconst imprensaPonderada = w => ({\n  pos: CLIPEI_TIER.mr.pos * w.mr + CLIPEI_TIER.r.pos * w.r + CLIPEI_TIER.menos.pos * w.menos,\n  neu: CLIPEI_TIER.mr.neu * w.mr + CLIPEI_TIER.r.neu * w.r + CLIPEI_TIER.menos.neu * w.menos,\n  neg: CLIPEI_TIER.mr.neg * w.mr + CLIPEI_TIER.r.neg * w.r + CLIPEI_TIER.menos.neg * w.menos\n});\nconst IMPRENSA_NS = [0.45, 0.22, 0.18, 0.30, 0.38, null]; // jan–mai estimados (Edelman 1S: 83% pos/neutro; UOL em fev, DFs em mar)\n// Mercado: proxy = veículos Muito Relevante + público investidores (Clipei) e eventos de rating\nconst MERCADO_JUN = { pos: 65, neu: 64, neg: 16 };\nconst MERCADO_NS = [0.35, 0.05, -0.15, 0.10, 0.30, null];\n// Institucional: clima das interações do CRM dos Stakeholders (propositivo / neutro / tenso)\nconst INST = [\n  { pos: 5, neu: 4, neg: 1 }, { pos: 6, neu: 5, neg: 2 }, { pos: 6, neu: 4, neg: 2 },\n  { pos: 6, neu: 5, neg: 3 }, { pos: 5, neu: 4, neg: 2 }, { pos: 6, neu: 4, neg: 2 }\n];\nconst BITES_JUN = BITES_W.n;\n\nconst ns = c => (c.pos + c.neu + c.neg) ? (c.pos - c.neg) / (c.pos + c.neu + c.neg) : 0;\nconst toScore = v => Math.round(((v + 1) / 2) * 100);\nconst pct = (n, t) => t ? Math.round((n / t) * 100) + '%' : '0%';\n\nconst FAIXAS = [\n  { min: 85, label: 'Referência', cor: '#0A6B60', hint: 'reputação é ativo de valor' },\n  { min: 70, label: 'Sólido', cor: '#17E3CB', hint: 'margem para absorver ruído' },\n  { min: 55, label: 'Estável', cor: '#9DA6C9', hint: 'equilíbrio frágil entre lentes' },\n  { min: 40, label: 'Atenção', cor: '#FE952B', hint: 'exige plano de recuperação' },\n  { min: 0, label: 'Crítico', cor: '#FF5C60', hint: 'risco ao valor da companhia' }\n];\nconst faixaDe = s => FAIXAS.find(f => s >= f.min);\n\nconst corScore = s => faixaDe(s).cor === '#9DA6C9' ? '#0027BD' : faixaDe(s).cor;\n\nconst FONTES = [\n  { id: 'clipei', nome: 'Clipei', tipo: 'Clipping de imprensa', lente: 'imprensa', cobertura: 'jun (base) · jan–mai via Edelman', volume: '1.506 matérias', nota: 'única fonte da lente' },\n  { id: 'edelman', nome: 'Edelman', tipo: 'Resumo semestral de imprensa', lente: 'mercado', cobertura: '1S26 consolidado', volume: '4.324 matérias (1S)', nota: 'contexto e proxy jan–mai' },\n  { id: 'approachSL', nome: 'Approach · Social Listening', tipo: 'Redes em mar aberto', lente: 'sociedade', cobertura: 'jan–jun', volume: '1.959 menções', nota: '' },\n  { id: 'bites', nome: 'Bites', tipo: 'Redes em mar aberto', lente: 'sociedade', cobertura: 'jun (base) · 1S resumo', volume: '4.973 classificadas', nota: 'metodologia ampliada em junho' },\n  { id: 'approachCM', nome: 'Approach · Community Management', tipo: 'Canais próprios', lente: 'clientes', cobertura: 'jan–jun', volume: '886 mensagens', nota: 'única fonte da lente' },\n  { id: 'crm', nome: 'CRM dos Stakeholders', tipo: 'Relacionamento institucional', lente: 'institucional', cobertura: 'jan–ago', volume: '60 interações', nota: 'única fonte da lente' }\n];\n\nconst FATOS_EVO = [\n  { mes: 'FEV', texto: 'UOL TAB publica reportagem sobre o Termo de Acordo homologado no STJ', efeito: 'pressiona' },\n  { mes: 'MAR', texto: 'Atraso e revisão das demonstrações financeiras; rebaixamentos de rating', efeito: 'pressiona' },\n  { mes: 'ABR', texto: 'Lucro de R$ 856 mi em 2025; encontros com Valor e Bloomberg reequilibram cobertura', efeito: 'sustenta' },\n  { mes: 'MAI', texto: 'Aporte de US$ 1 bi de Itaúsa e GIC anunciado na Brazil Week', efeito: 'sustenta' },\n  { mes: 'JUN', texto: 'CEO fala em IPO 2027 na CNN; disputa da Copasa e novas menções ao acordo no MT', efeito: 'misto' }\n];\n\nclass Component extends DCLogic {\n  state = { evoLente: null, hoverLente: null, mes: 5, view: 'geral', lente: 'imprensa', fontesOff: {}, tier: 'aegea', social: 'n', pesosOv: {} };\n\n  evolVals(lentes, fatos, mi) {\n    const W = 1000, H = 330, PADT = 14, PADB = 34, LAB = 72, n = MESES.length;\n    const xs = MESES.map((_, i) => ((i + 0.5) / n) * W);\n    const serieIsr = MESES.map((_, i) => this.isrDe(i));\n    const sel = this.state.evoLente;\n    const serieLente = sel ? MESES.map((_, i) => this.lenteScores(i)[sel]) : null;\n    const vals = serieIsr.concat(serieLente || []);\n    let lo = Math.max(0, Math.floor((Math.min(...vals) - 8) / 5) * 5), hi = Math.min(100, Math.ceil((Math.max(...vals) + 8) / 5) * 5);\n    if (hi - lo < 30) { const c = (hi + lo) / 2; lo = Math.max(0, Math.round(c - 15)); hi = Math.min(100, lo + 30); }\n    const y = v => PADT + (H - PADT - PADB) * (1 - (v - lo) / (hi - lo));\n    const curva = arr => {\n      const p = arr.map((v, i) => [xs[i], y(v)]);\n      let d = 'M' + p[0][0].toFixed(1) + ' ' + p[0][1].toFixed(1);\n      for (let i = 0; i < p.length - 1; i++) {\n        const p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p2;\n        const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];\n        d += 'C' + c1.map(v => v.toFixed(1)).join(' ') + ' ' + c2.map(v => v.toFixed(1)).join(' ') + ' ' + p2[0].toFixed(1) + ' ' + p2[1].toFixed(1);\n      }\n      return d;\n    };\n    const FAIXAS_EVO = [[0, 40, '#FFE7E8', 'Crítico', '#B32328'], [40, 55, '#FFF1DC', 'Atenção', '#8A4E00'], [55, 70, '#EEF1F8', 'Estável', '#0027BD'], [70, 85, '#DFFAF6', 'Sólido', '#0A6B60'], [85, 100, '#C8F2EA', 'Referência', '#0A6B60']];\n    const bandas = FAIXAS_EVO.filter(b => b[1] > lo && b[0] < hi).map(b => {\n      const a = Math.max(b[0], lo), z = Math.min(b[1], hi);\n      return { y: y(z).toFixed(1), h: (y(a) - y(z)).toFixed(1), fill: b[2],\n        labelStyle: 'position:absolute;left:calc(100% + 10px);text-align:left;white-space:nowrap;top:' + (((y(z) + y(a)) / 2) / H * 100).toFixed(2) + '%;transform:translateY(-50%);font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:' + b[4] + ';pointer-events:none',\n        label: b[3] };\n    });\n    const ticks = [];\n    for (let v = Math.ceil(lo / 10) * 10; v <= hi; v += 10) ticks.push({ label: String(v), style: 'position:absolute;right:calc(100% + 8px);top:' + (y(v) / H * 100).toFixed(2) + '%;transform:translateY(-50%);font-size:11px;color:#A6ABBD' });\n    const fatoDe = i => fatos.find(x => MESES.indexOf(x.mes.toLowerCase()) === i);\n    const corEf = e => e === 'pressiona' ? '#FF5C60' : e === 'sustenta' ? '#17E3CB' : '#9DA6C9';\n    const nomeDe = id => (lentes.find(l => l.id === id) || {}).nome || id;\n    const colunas = MESES.map((m, i) => {\n      const v = serieIsr[i], d = i ? v - serieIsr[i - 1] : null;\n      const s = this.lenteScores(i), sp = i ? this.lenteScores(i - 1) : null;\n      let mov = null;\n      if (sp) { const k = Object.keys(s).map(k => [k, s[k] - sp[k]]).sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]))[0]; if (k && k[1]) mov = nomeDe(k[0]) + ' ' + (k[1] > 0 ? '+' : '') + k[1]; }\n      const fa = fatoDe(i);\n      return {\n        mes: ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto'][i],\n        isr: v, delta: d == null ? 'ponto de partida' : (d > 0 ? '+' : '') + d + '  imprensa, mercado, sociedade digital, clientes e institucional — cada um com a sua fonte e o seu peso. Gartner: saúde reputacional exige olhar além de clientes e além da mídia.' },\n        { passo: '2. Sentimento líquido', texto: 'Para cada lente, NS = (positivo − negativo) ÷ total. Na imprensa, cada matéria é ponderada pelo tier do veículo — default 10 · 5 · 1, os pesos do rascunho de score da Aegea, com presets alternativos na tela para calibrar.' },\n        { passo: '2b. Engajamento', texto: 'Nas redes, cada menção pode valer 1 (contagem), 1 + log₁₀ do engajamento (default recomendado: dá diferença real sem deixar um viral dominar), o engajamento bruto, ou o cargo do autor na Bites.' },\n        { passo: '3. Escala 0–100', texto: 'Score da lente = (NS + 1) ÷ 2 × 100. Zero é tudo negativo; 50 é equilíbrio; 100 é tudo positivo. Faixas: Crítico < 40 · Atenção 40–54 · Estável 55–69 · Sólido 70–84 · Referência ≥ 85.' },\n        { passo: '4. Índice', texto: 'ISR = média ponderada das cinco lentes. Pesos default 30 / 20 / 20 / 15 / 15, ajustáveis nos Tweaks para calibrar com a diretoria.' },\n        { passo: '5. Drivers', texto: 'Atributos reputacionais (taxonomia da clipagem) e temas em perpetuação explicam o número — o \"porquê\", não só o \"quanto\".' },\n        { passo: '6. Unidades', texto: 'Exposição por concessionária. Com a base de economias, aplica-se o Score2 da Aegea (negativo ponderado ÷ economias × 1.000) para comparar portes diferentes.' }\n      ],\n      gartner: [\n        { criterio: 'Múltiplos stakeholders (mídia, investidores, público)', status: 'Coberto' },\n        { criterio: 'Agregação multifonte', status: 'Coberto' },\n        { criterio: 'Benchmark histórico', status: 'Coberto' },\n        { criterio: 'Benchmark contra pares do setor', status: 'A integrar' },\n        { criterio: 'Análise de sentimento com drivers', status: 'Coberto' },\n        { criterio: 'Alertas de mudança / perpetuação', status: 'Parcial' },\n        { criterio: 'Ligação com resultado de negócio (valor)', status: 'A integrar' }\n      ].map(g => ({ ...g, chip: chipStatus(g.status) }))\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
